[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picpicker"
version = "3.1.5"
description = "Desktop app for reviewing photos and videos one at a time: keep or delete"
requires-python = ">=3.10"
dependencies = ["Pillow", "piexif", "winshell; sys_platform == 'win32'", "pywin32; sys_platform == 'win32'", "Send2Trash; sys_platform != 'win32'"]

[project.optional-dependencies]
formats = ["pillow-heif", "rawpy"]

[project.scripts]
picpicker = "picpicker.__main__:main"

[tool.setuptools.packages.find]
include = ["picpicker*"]
